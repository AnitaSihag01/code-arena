<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - JudgeBox</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container-narrow">
    <div class="card">
        <h1>Log In</h1>

        <p class="alert alert-error" th:if="${param.error}">Invalid username or password</p>
        <p class="alert alert-success" th:if="${param.registered}">Account created — please log in</p>
        <p class="alert alert-info" th:if="${param.logout}">You've been logged out</p>

        <form class="auth-form" th:action="@{/login}" method="post">
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Log In</button>
        </form>

        <p class="auth-footer">Don't have an account? <a th:href="@{/signup}">Sign up</a></p>
    </div>
</div>
</body>
</html>
