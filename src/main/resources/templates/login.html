<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - JudgeBox</title>
</head>
<body>
<h1>Log In</h1>

<p th:if="${param.error}" style="color: red;">Invalid username or password</p>
<p th:if="${param.registered}" style="color: green;">Account created — please log in</p>
<p th:if="${param.logout}" style="color: blue;">You've been logged out</p>

<form th:action="@{/login}" method="post">
    <div>
        <label>Username</label>
        <input type="text" name="username" required>
    </div>
    <div>
        <label>Password</label>
        <input type="password" name="password" required>
    </div>
    <button type="submit">Log In</button>
</form>

<p>Don't have an account? <a th:href="@{/signup}">Sign up</a></p>
</body>
</html>
