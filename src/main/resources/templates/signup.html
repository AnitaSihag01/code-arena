<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - JudgeBox</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container-narrow">
    <div class="card">
        <h1>Create an Account</h1>

        <p class="alert alert-error" th:if="${error}" th:text="${error}"></p>

        <form class="auth-form" th:action="@{/signup}" method="post">
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Sign Up</button>
        </form>

        <p class="auth-footer">Already have an account? <a th:href="@{/login}">Log in</a></p>
    </div>
</div>
</body>
</html>
